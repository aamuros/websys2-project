<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Community Garden — Dashboard Preview</title>

  <!-- Standalone preview of Figma node 1:2.
       Icons use the same Lucide glyphs as the project implementation. -->
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --background: #f4ede6;
      --foreground: #404f1d;
      --card: #f8f3ed;
      --primary: #404f1d;
      --primary-foreground: #f4ede6;
      --secondary: #ebe5da;
      --muted-foreground: #6f7559;
      --border: #d5cfc2;
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { background: var(--primary); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: var(--primary);
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 50;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .topbar .brand-icon {
      width: 20px;
      height: 20px;
      stroke-width: 1.8;
    }

    .app-surface {
      position: fixed;
      inset: 52px 0 0 0;
      min-height: 0;
      overflow: hidden;
      border-radius: 24px 24px 0 0;
      background: var(--background);
      box-shadow: 0 -1px 0 rgba(255,255,255,.04);
    }

    .sidebar {
      position: absolute;
      z-index: 40;
      left: 0;
      top: 0;
      bottom: 0;
      width: 241px;
      border-right: 1px solid rgba(213, 207, 194, .60);
      background: var(--background);
    }

    .sidebar-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .account-row {
      height: 56px;
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    .account-button {
      width: 172px;
      height: 36px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      cursor: pointer;
      transition: background .15s ease;
    }

    .account-button:hover,
    .round-button:hover,
    .nav-item:not(.active):hover {
      background: rgba(64, 79, 29, .08);
    }

    .avatar {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      border-radius: 999px;
      background: rgba(64, 79, 29, .20);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 600;
    }

    .account-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      text-align: left;
    }

    .account-button svg {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
    }

    .round-button {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .15s ease;
    }

    .round-button svg { width: 19px; height: 19px; }

    .nav {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 12px 4px;
    }

    .nav-primary { padding: 8px 0; }
    .nav-tools { padding: 8px 0; }

    .nav-item {
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      color: var(--muted-foreground);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      transition: background .15s ease, color .15s ease;
    }

    .nav-item + .nav-item { margin-top: 1px; }
    .nav-item svg { width: 20px; height: 20px; flex: 0 0 20px; }

    .nav-item.active {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .nav-item.placeholder {
      color: rgba(111, 117, 89, .72);
      cursor: default;
    }

    .tools-label {
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 600;
      color: rgba(111, 117, 89, .72);
    }

    .tool-item {
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: rgba(111, 117, 89, .72);
      cursor: default;
    }

    .tool-item svg { width: 20px; height: 20px; }

    .sidebar-bottom {
      margin-top: auto;
      height: 40px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0 8px;
    }

    .main {
      height: 100%;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      padding: 0 40px 0 296px;
      background: var(--background);
    }


    .main::-webkit-scrollbar {
      width: 10px;
    }

    .main::-webkit-scrollbar-track {
      background: transparent;
    }

    .main::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 999px;
      background: rgba(64, 79, 29, .22);
      background-clip: padding-box;
    }

    .main {
      scrollbar-width: thin;
      scrollbar-color: rgba(64, 79, 29, .22) transparent;
    }

    .page-header,
    .content {
      width: 100%;
      max-width: 1151px;
    }

    .page-header {
      position: relative;
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px 0;
      border-bottom: 0;
      background: var(--background);
    }

    h1, h2, h3, p { margin: 0; }

    .page-header-copy {
      min-width: 0;
      flex: 1 1 auto;
      padding-right: 16px;
    }

    .page-header h1 {
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -.35px;
      white-space: nowrap;
    }

    .page-header-description {
      margin-top: 0;
      font-size: 14px;
      line-height: 20px;
      color: var(--muted-foreground);
    }

    .page-header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
    }

    .header-search {
      width: 208px;
      height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 11px;
      border: 1px solid rgba(64, 79, 29, .12);
      border-radius: 10px;
      background: rgba(248, 243, 237, .72);
      box-shadow: 0 1px 2px rgba(64, 79, 29, .04), inset 0 1px 0 rgba(255, 255, 255, .28);
      color: var(--muted-foreground);
    }

    .header-search svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
    }

    .header-search input {
      min-width: 0;
      width: 100%;
      height: 30px;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: var(--foreground);
      font: inherit;
      font-size: 14px;
      line-height: 20px;
    }

    .header-search input::placeholder {
      color: rgba(111, 117, 89, .72);
      opacity: 1;
    }

    .header-new-button {
      height: 32px;
      border: 1px solid var(--primary);
      border-radius: 10px;
      background: var(--primary);
      color: var(--primary-foreground);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 11px;
      box-shadow: 0 1px 1px rgba(64, 79, 29, .14), inset 0 1px 0 rgba(255, 255, 255, .08);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .header-new-button:hover {
      transform: translateY(-1px);
      background: #4a5b23;
    }

    .header-new-button svg {
      width: 16px;
      height: 16px;
    }

    .content { padding: 40px 0; }

    .section-title {
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -.5px;
    }

    .garden-card {
      width: 280px;
      height: 356px;
      margin-top: 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--secondary);
    }

    .garden-visual {
      height: 276px;
      padding: 32px;
      display: grid;
      place-items: center;
      background: rgba(64, 79, 29, .06);
    }

    .garden-emblem {
      width: 164px;
      height: 164px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .garden-emblem svg {
      width: 80px;
      height: 80px;
      stroke-width: 1.2;
    }

    .garden-card-footer {
      height: 78px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-top: 1px solid rgba(213, 207, 194, .40);
    }

    .garden-meta {
      width: 124px;
      min-width: 0;
    }

    .garden-name {
      height: 28px;
      overflow: hidden;
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -.5px;
      white-space: nowrap;
    }

    .garden-access {
      font-size: 14px;
      line-height: 20px;
      color: var(--muted-foreground);
      text-transform: capitalize;
    }

    .garden-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .icon-circle,
    .outline-pill {
      height: 40px;
      border: 1px solid var(--border);
      background: rgba(244, 237, 230, .60);
      border-radius: 999px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-circle { width: 40px; }
    .icon-circle svg { width: 18px; height: 18px; }

    .outline-pill {
      padding: 0 12px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
    }

    .overview {
      padding-top: 32px;
    }

    .overview-grid {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }

    .overview-card {
      position: relative;
      height: 340px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      padding: 20px;
    }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 24px;
    }

    .card-topline h3 {
      font-size: 16px;
      line-height: 24px;
      font-weight: 600;
    }

    .card-topline span {
      font-size: 14px;
      line-height: 20px;
      color: var(--muted-foreground);
    }

    .readiness-body {
      height: 226px;
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .readiness-icon {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .readiness-icon svg { width: 20px; height: 20px; }

    .readiness-copy {
      max-width: 448px;
      font-size: 24px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -.6px;
    }

    .ready-button {
      position: absolute;
      left: 20px;
      bottom: 20px;
      height: 32px;
      border: 1px solid rgba(64, 79, 29, .35);
      background: transparent;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      color: var(--primary);
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      cursor: pointer;
    }

    .check-badge {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .check-badge svg { width: 10px; height: 10px; stroke-width: 3; }

    .activity-preview {
      position: relative;
      height: 178px;
      overflow: hidden;
      border: 1px solid rgba(213, 207, 194, .40);
      border-radius: 16px;
      background: var(--secondary);
    }

    .mock-window {
      position: absolute;
      left: 50%;
      top: 16px;
      width: 301px;
      height: 256px;
      transform: translateX(-50%);
      border: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      background: var(--background);
      box-shadow: 0 8px 26px rgba(64, 79, 29, .08);
    }

    .mock-titlebar {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border-bottom: 1px solid rgba(213, 207, 194, .40);
    }

    .dot { width: 8px; height: 8px; border-radius: 999px; background: rgba(64,79,29,.35); }
    .dot:nth-child(2) { background: rgba(64,79,29,.20); }
    .dot:nth-child(3) { background: rgba(64,79,29,.10); }

    .mock-content { padding: 16px; }
    .skeleton {
      height: 12px;
      border-radius: 999px;
      background: rgba(64, 79, 29, .10);
    }

    .skeleton.strong { width: 178px; background: rgba(64, 79, 29, .20); }
    .skeleton.full { width: 267px; margin-top: 12px; }
    .skeleton.short { width: 214px; margin-top: 12px; }

    .bars {
      height: 102px;
      margin-top: 8px;
      padding-top: 20px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .bar {
      flex: 1;
      border-radius: 4px 4px 0 0;
      background: rgba(64, 79, 29, .25);
    }

    .activity-copy {
      padding-top: 12px;
      text-align: center;
    }

    .activity-copy h3 {
      font-size: 20px;
      line-height: 28px;
      font-weight: 600;
      letter-spacing: -.5px;
    }

    .activity-copy p {
      padding-top: 2px;
      font-size: 14px;
      line-height: 20px;
      color: var(--muted-foreground);
    }

    .chips {
      height: 46px;
      padding-top: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }

    .chip {
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px dashed rgba(64, 79, 29, .35);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
      white-space: nowrap;
    }

    .chip svg { width: 14px; height: 14px; }


    .dashboard-stack {
      display: grid;
      gap: 32px;
    }

    .eyebrow {
      font-size: 12px;
      line-height: 16px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
      color: var(--muted-foreground);
    }

    .section-heading-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .section-heading-copy p {
      margin-top: 4px;
      max-width: 620px;
      font-size: 14px;
      line-height: 21px;
      color: var(--muted-foreground);
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      background: transparent;
      color: var(--foreground);
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .text-link svg { width: 15px; height: 15px; }

    .hero-panel {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, .75fr);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
    }

    .hero-main {
      min-height: 252px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-main h2 {
      max-width: 650px;
      margin-top: 10px;
      font-size: clamp(27px, 3vw, 36px);
      line-height: 1.08;
      letter-spacing: -.04em;
      font-weight: 650;
    }

    .hero-main p {
      max-width: 610px;
      margin-top: 14px;
      font-size: 15px;
      line-height: 23px;
      color: var(--muted-foreground);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .solid-button,
    .soft-button {
      height: 40px;
      border-radius: 999px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .solid-button {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .soft-button {
      border: 1px solid var(--border);
      background: var(--background);
      color: var(--foreground);
    }

    .solid-button svg,
    .soft-button svg { width: 16px; height: 16px; }

    .hero-side {
      min-height: 252px;
      padding: 24px;
      border-left: 1px solid rgba(213, 207, 194, .65);
      background: var(--secondary);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .attention-count {
      margin-top: 8px;
      font-size: 48px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -.055em;
    }

    .attention-label {
      margin-top: 7px;
      font-size: 14px;
      line-height: 21px;
      color: var(--muted-foreground);
    }

    .attention-list {
      display: grid;
      gap: 9px;
      margin-top: 20px;
    }

    .attention-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      line-height: 18px;
      color: var(--foreground);
    }

    .attention-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--primary);
      flex: 0 0 8px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .stat-card {
      min-height: 142px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .stat-icon {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(64, 79, 29, .09);
      display: grid;
      place-items: center;
    }

    .stat-icon svg { width: 17px; height: 17px; }

    .status-chip {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border: 1px solid rgba(64,79,29,.18);
      border-radius: 999px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-foreground);
      white-space: nowrap;
    }

    .stat-value {
      margin-top: 18px;
      font-size: 30px;
      line-height: 32px;
      font-weight: 650;
      letter-spacing: -.04em;
    }

    .stat-label {
      margin-top: 2px;
      font-size: 13px;
      line-height: 18px;
      color: var(--muted-foreground);
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(320px, .82fr);
      gap: 24px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      overflow: hidden;
    }

    .panel-head {
      min-height: 72px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid rgba(213,207,194,.55);
    }

    .panel-head h3 {
      font-size: 17px;
      line-height: 23px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .panel-head p {
      margin-top: 3px;
      font-size: 13px;
      line-height: 18px;
      color: var(--muted-foreground);
    }

    .request-list {
      display: grid;
    }

    .request-row {
      min-height: 76px;
      padding: 15px 20px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      border-bottom: 1px solid rgba(213,207,194,.42);
    }

    .request-row:last-child { border-bottom: 0; }

    .request-person {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .request-avatar {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--secondary);
      font-size: 12px;
      font-weight: 700;
    }

    .request-name {
      font-size: 14px;
      line-height: 19px;
      font-weight: 650;
    }

    .request-meta {
      margin-top: 2px;
      font-size: 12px;
      line-height: 17px;
      color: var(--muted-foreground);

    .request-action {

      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--background);
      padding: 0 11px;
      font-size: 12px;
      line-height: 16px;
      font-weight: 650;

    .schedule-list {

    }

    .schedule-row {
      min-height: 72px;

      grid-template-columns: 54px 1fr;
      gap: 13px;
      align-items: center;
      border-bottom: 1px solid rgba(213,207,194,.42);

    .date-tile {

      place-items: center;
      text-align: center;

    .date-tile span:first-child {
      display: block;
      font-size: 10px;
      line-height: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted-foreground);
    }

    .date-tile span:last-child {
      display: block;
      margin-top: 1px;
      font-size: 18px;
      line-height: 19px;
      font-weight: 700;
    }

    .schedule-title {
      font-size: 14px;
      line-height: 19px;
      font-weight: 650;
    }

    .schedule-meta {
      margin-top: 2px;
      font-size: 12px;
      line-height: 17px;
      color: var(--muted-foreground);
    }

    .bottom-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);

    .plot-board {
      padding: 20px;

    .plot-summary {

      align-items: baseline;
      gap: 8px;
      margin-bottom: 18px;

    .plot-summary strong {
      font-size: 28px;
      line-height: 30px;
      letter-spacing: -.04em;
    }

    .plot-summary span {
      font-size: 13px;
      color: var(--muted-foreground);
    }

    .plot-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .plot-cell {
      min-height: 84px;
      border: 1px solid rgba(64,79,29,.16);
      border-radius: 16px;
      padding: 12px;
      background: var(--background);

    .plot-cell strong {
      display: block;
      font-size: 13px;
      line-height: 18px;
    }

    .plot-cell span {
      display: inline-flex;
      align-items: center;
      margin-top: 20px;
      font-size: 11px;
      line-height: 15px;
      color: var(--muted-foreground);
    }

    .plot-cell.available { background: rgba(64, 79, 29, .06); }
    .plot-cell.occupied { background: var(--secondary); }
    .plot-cell.maintenance { background: rgba(163, 63, 50, .05); }

    .update-card {
      height: 100%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .update-icon {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .update-icon svg { width: 19px; height: 19px; }

    .update-card h3 {
      margin-top: 20px;
      font-size: 22px;
      line-height: 26px;
      letter-spacing: -.035em;
      font-weight: 650;
    }

    .update-card p {
      margin-top: 9px;
      font-size: 14px;
      line-height: 21px;
      color: var(--muted-foreground);
    }

    .update-foot {
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted-foreground);
    }

    .mobile-menu { display: none; }

    @media (max-width: 1050px) {
      .sidebar { display: none; }
      .main { padding-left: 24px; padding-right: 24px; }

      .mobile-menu {
        display: grid;

        width: 36px;
        height: 36px;
        margin-left: auto;
        border: 0;
        background: transparent;

      }
      .overview-grid { grid-template-columns: 1fr; }
      .overview-card { max-width: 563.5px; }
      .hero-panel,
      .main-grid,
      .bottom-grid { grid-template-columns: 1fr; }
      .hero-side { border-left: 0; border-top: 1px solid rgba(213, 207, 194, .65); }
      .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .plot-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 650px) {
      .main { padding: 0 16px; }
      .page-header {
        min-height: 0;
        align-items: stretch;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 20px 0;
      }
      .page-header-copy { padding-right: 0; }
      .page-header h1 { white-space: normal; }
      .page-header-description { max-width: 34rem; }
      .page-header-actions { width: 100%; }
      .header-search { width: auto; flex: 1 1 auto; }
      .header-new-button { flex: 0 0 auto; }
      .content { padding-top: 28px; }
      .overview-card { height: auto; min-height: 340px; }
      .mock-window { width: min(301px, calc(100% - 40px)); }
      .content { padding-bottom: 28px; }
      .dashboard-stack { gap: 24px; }
      .hero-main, .hero-side { padding: 22px; }
      .stat-grid { grid-template-columns: 1fr; }
      .section-heading-row { align-items: flex-start; flex-direction: column; }

      .request-row { grid-template-columns: 1fr; }
      .request-action { width: max-content; margin-left: 50px; }
    }


    /* Dashboard content adapted from Figma node 1:668:
       920px content rail, compact summary cards, one primary activity card,
       an informational banner, 3-column insight grids, and a totals strip. */
    .garden-admin-dashboard {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 24px 0 36px;
    }

    .garden-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: -6px -12px 0;
      padding: 6px 12px;
      overflow: hidden;
    }

    .garden-card-surface {
      background: var(--card);
      border-radius: 24px;

    .garden-summary-card {
      height: 96px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    .garden-summary-icon {
      width: 24px;
      height: 24px;

      place-items: center;

      height: 24px;

      line-height: 24px;

    .garden-summary-label {
      margin-top: 1px;
      font-size: 14px;
      line-height: 20px;
      color: var(--muted-foreground);
    }

    .garden-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: auto;
      gap: 16px;
      margin-top: 12px;

    .garden-activity-card {

      min-height: 420px;

    .garden-card-caption {

    .garden-card-title {

    .garden-chart-legend {

    .garden-ring-label {
